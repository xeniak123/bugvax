# bugvax vaccine: an ast-grep rule learned from a real bug fix.
id: numeric-sort-without-comparator
language: tsx
severity: warning
message: .sort() without a comparator compares numbers as strings (e.g. [10, 9, 100] -> [10, 100, 9]); pass (a, b) => a - b.
note: Array.prototype.sort() coerces elements to strings and compares them lexicographically, so arrays of numbers come out in the wrong order. In a function whose result type is numeric, always pass an explicit numeric comparator such as (a, b) => a - b (default sorting is fine only for strings).
rule:
  kind: call_expression
  all:
    - pattern: $ARR.sort()
    # curated: only functions that return a numeric array, not any function mentioning `number`
    - inside:
        stopBy: end
        has:
          field: return_type
          regex: '^:\s*(Promise<\s*)?(number\[\]|Array<number>|readonly number\[\])'
metadata:
  bugvax:
    title: Numeric array sorted with .sort() and no comparator
    learnedAt: 2026-09-23T18:03:46.682Z
