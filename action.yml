name: bugvax
description: Block pull requests that re-introduce bugs your repository already fixed (bugvax antibodies).
author: xeniak123
branding:
  icon: shield
  color: green

inputs:
  base:
    description: Branch, tag or commit to compare against. Defaults to the pull request's base branch; without one, the whole repository is scanned.
    required: false
    default: ""
  version:
    description: bugvax version to run (npm version or dist-tag). Defaults to the version of this action, so pinning the action pins bugvax too.
    required: false
    default: ""
  args:
    description: Extra arguments for `bugvax check` / `bugvax scan`.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: bugvax
      shell: bash
      env:
        BASE: ${{ inputs.base || github.base_ref }}
        VERSION: ${{ inputs.version }}
        ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        VERSION="${VERSION:-$(node -p "require(process.env.GITHUB_ACTION_PATH + '/package.json').version")}"
        if [ -n "$BASE" ]; then
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --quiet --unshallow origin
          fi
          # A branch, tag or SHA: compare against exactly what was fetched.
          git fetch --no-tags --quiet origin "${BASE#origin/}"
          npx -y "bugvax@${VERSION}" check --base "$(git rev-parse FETCH_HEAD)" $ARGS
        else
          npx -y "bugvax@${VERSION}" scan $ARGS
        fi
