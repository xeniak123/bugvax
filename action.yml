name: bugvax
description: Block pull requests that re-introduce bugs your repository already fixed (bugvax antibodies).
author: xeniak123
branding:
  icon: shield
  color: green

inputs:
  base:
    description: Git ref to compare against. Defaults to the pull request's base branch; without one, the whole repository is scanned.
    required: false
    default: ""
  version:
    description: bugvax version to run (npm dist-tag or version).
    required: false
    default: latest
  args:
    description: Extra arguments for `bugvax check` / `bugvax scan`.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: bugvax
      shell: bash
      env:
        BASE: ${{ inputs.base || github.base_ref }}
        VERSION: ${{ inputs.version }}
        ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        if [ -n "$BASE" ]; then
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --quiet --unshallow origin
          fi
          git fetch --no-tags --quiet origin "$BASE"
          npx -y "bugvax@${VERSION}" check --base "origin/${BASE}" $ARGS
        else
          npx -y "bugvax@${VERSION}" scan $ARGS
        fi
