name: release

# Push a version tag to publish: npm version patch && git push --follow-tags
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # GitHub release + moving the v1 action tag
  id-token: write # npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (no token) needs a recent npm CLI.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish --provenance --access public
        env:
          # Only needed until trusted publishing is configured on npmjs.com.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
      - name: Move the v1 tag used by `uses: xeniak123/bugvax@v1`
        run: |
          git tag -f v1
          git push -f origin v1
