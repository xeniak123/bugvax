name: release

# Push a version tag to publish: npm version patch && git push --follow-tags
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # Build and test with no write access at all: dependency code never sees a publishing credential.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: bugvax-*.tgz

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance / trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
      # Node 24 ships npm 11, which supports trusted publishing (no token).
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish the tested tarball (no install or lifecycle scripts run here)
        run: npm publish ./bugvax-*.tgz --provenance --access public --ignore-scripts
        env:
          # Only needed until trusted publishing is configured on npmjs.com.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release + moving the action's major tag
    steps:
      - uses: actions/checkout@v5
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
      # `uses: xeniak123/bugvax@v1` is the action's interface version. It follows stable 0.x and 1.x
      # releases, never pre-releases, and never a 2.x release that may change the CLI.
      - name: "Move the v1 tag used by the GitHub Action"
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[01]\.[0-9]+\.[0-9]+$ ]]; then
            git tag -f v1
            git push -f origin v1
          else
            echo "not moving v1 for $GITHUB_REF_NAME"
          fi
